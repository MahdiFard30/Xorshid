# ═══ ULTIMATE KHORSHID — کانفیگ پیش‌فرض (آفلاین، بدون API) ═══

[intelligence]
default_model = "mock/smart"
preferred_engine = "mock"
temperature = 0.7
max_tokens = 1500
top_p = 0.9

[agent]
default_agent = "computer"
max_turns = 12
tools = "*"
context_from_memory = true
auto_memory = true
history_turns = 8
memory_retention = 1000
persona = "khorshid"
language = "fa"

[engine]
default = "mock"

[engine.ollama]
host = "http://localhost:11434"
model = "qwen2.5:7b"

[engine.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# api_key = "sk-..."  # یا متغیر محیطی OPENAI_API_KEY

[engine.groq]
model = "openai/gpt-oss-120b"
# Dedicated key: GROQ_API_KEY or the project-local .groq.key file.
# Fallback order with a key: Gemini -> Groq -> Ollama -> Mock.

[tools]
confirm_dangerous = true
workspace = "~/ultimate-jarvis-workspace"

[tools.storage]
default_backend = "sqlite"
db_path = "~/.ultimate-jarvis/memory.db"

[server]
host = "127.0.0.1"
port = 8899
agent = "computer"

